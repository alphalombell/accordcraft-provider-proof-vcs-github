name: AccordCraft 17A.3 External BuildProof and Release Passport Proof

on:
  push:
    branches:
      - proof/17a3-buildproof-a1

permissions:
  contents: read

concurrency:
  group: accordcraft-17a3-buildproof-proof
  cancel-in-progress: false

jobs:
  external-buildproof:
    name: AccordCraft External BuildProof Proof
    runs-on: ubuntu-latest
    environment: accordcraft-ci-proof-approval
    timeout-minutes: 15
    env:
      TASK_ID: AC-FSSOC-SETUP-17A.3
      VCS_PROVIDER_ID: provider::github::vcs
      CI_PROVIDER_ID: provider::github-actions::cicd
      CANONICAL_SEMANTIC_DIGEST: 147EF2E166EAD754E8AC21CAC46EAD00A4DD63AF04D3437F31A6CE3EF134BA97
      CANONICAL_AUTHORITIES_B64: 
      NATIVE_REFERENCE_VCS_PROVIDER: Forgejo
      NATIVE_REFERENCE_CI_PROVIDER: Woodpecker
      PROOF_SCOPE: BOUNDED_SYNTHETIC_NON_CLIENT
      PRODUCTION_AUTHORITY: "false"
      CLIENT_DATA: "false"

    steps:
      - name: Generate provider-neutral Build Contract and BuildProof evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof/buildproof proof/release-passport

          printf '%s' "${CANONICAL_AUTHORITIES_B64}" | base64 -d > proof/buildproof/canonical-authorities.json

          python3 - <<'PY'
          import hashlib, json, os, pathlib

          root = pathlib.Path("proof/buildproof")
          authorities = json.loads((root / "canonical-authorities.json").read_text(encoding="utf-8"))
          canonical_digest = os.environ["CANONICAL_SEMANTIC_DIGEST"]

          build_contract = {
              "schema": "accordcraft.external-provider-build-contract-proof.v1",
              "task_id": os.environ["TASK_ID"],
              "proof_scope": os.environ["PROOF_SCOPE"],
              "canonical_semantic_authority": {
                  "digest_sha256": canonical_digest,
                  "authorities": authorities,
              },
              "source": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "commit_sha": os.environ["GITHUB_SHA"],
                  "ref": os.environ["GITHUB_REF"],
              },
              "provider_substitution": {
                  "native_reference": {
                      "vcs_provider": os.environ["NATIVE_REFERENCE_VCS_PROVIDER"],
                      "ci_provider": os.environ["NATIVE_REFERENCE_CI_PROVIDER"],
                      "canonical_semantic_digest_sha256": canonical_digest,
                  },
                  "external_proof": {
                      "vcs_provider": os.environ["VCS_PROVIDER_ID"],
                      "ci_provider": os.environ["CI_PROVIDER_ID"],
                      "canonical_semantic_digest_sha256": canonical_digest,
                  },
                  "canonical_semantics_stable": True,
              },
              "production_authority": False,
              "client_data": False,
          }

          (root / "build-contract.json").write_text(
              json.dumps(build_contract, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          build_contract_digest = hashlib.sha256(
              (root / "build-contract.json").read_bytes()
          ).hexdigest().upper()

          limitations = {
              "schema": "accordcraft.provider-specific-limitations-and-evidence-quality.v1",
              "task_id": os.environ["TASK_ID"],
              "provider_path": {
                  "vcs": os.environ["VCS_PROVIDER_ID"],
                  "ci": os.environ["CI_PROVIDER_ID"],
              },
              "limitations": [
                  "Dedicated public synthetic proof repository only; no client repository authority.",
                  "GitHub Actions support remains bounded to the approved CONDITIONAL proof profile.",
                  "This proof does not grant production authority.",
                  "This proof uses no client data.",
                  "Provider-native workflow, run, job, environment, and artifact identifiers are evidence details and do not replace canonical AccordCraft semantics.",
              ],
              "evidence_quality": {
                  "canonical_semantics": "VERIFIED_BY_EXACT_CANONICAL_AUTHORITY_HASH_BINDING",
                  "source_commit": "VERIFIED_PROVIDER_NATIVE",
                  "workflow_identity": "VERIFIED_PROVIDER_NATIVE",
                  "execution_identity": "VERIFIED_PROVIDER_NATIVE",
                  "approval_environment": "VERIFIED_PROVIDER_NATIVE",
                  "artifact_archive_digest": "VERIFIED_PROVIDER_NATIVE_AFTER_UPLOAD",
                  "tests": "MINIMAL_SYNTHETIC_PROOF_ONLY_NOT_PRODUCT_TEST_SUITE",
                  "quality_gates": "NOT_PERFORMED_NOT_CLAIMED",
                  "security_scan": "NOT_PERFORMED_NOT_CLAIMED",
                  "license_scan": "NOT_PERFORMED_NOT_CLAIMED",
                  "sbom": "NOT_PRODUCED_NOT_CLAIMED",
                  "vulnerability_disposition": "NOT_PERFORMED_NOT_CLAIMED",
                  "provenance_attestation": "TASK_EVIDENCE_ONLY_NOT_SUPPLY_CHAIN_ATTESTATION",
                  "artifact_signature": "NOT_PRODUCED_NOT_CLAIMED",
                  "independent_rebuild": "NOT_PERFORMED_NOT_CLAIMED",
                  "staging_acceptance": "NOT_PERFORMED_NOT_CLAIMED",
                  "production_authorization": "NOT_REQUESTED_NOT_GRANTED",
                  "deployment": "NOT_PERFORMED_NOT_CLAIMED",
                  "rollback": "NOT_PERFORMED_NOT_CLAIMED",
              },
          }

          (root / "provider-limitations.json").write_text(
              json.dumps(limitations, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          buildproof = {
              "schema": "accordcraft.external-provider-buildproof-proof.v1",
              "task_id": os.environ["TASK_ID"],
              "canonical_semantic_digest_sha256": canonical_digest,
              "build_contract": {
                  "path": "build-contract.json",
                  "sha256": build_contract_digest,
              },
              "requirement_refs": [os.environ["TASK_ID"]],
              "source": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "commit_sha": os.environ["GITHUB_SHA"],
                  "ref": os.environ["GITHUB_REF"],
              },
              "workflow": {
                  "name": os.environ["GITHUB_WORKFLOW"],
                  "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
                  "job": os.environ["GITHUB_JOB"],
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_number": os.environ["GITHUB_RUN_NUMBER"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              },
              "execution_identity": {
                  "actor": os.environ["GITHUB_ACTOR"],
                  "actor_id": os.environ["GITHUB_ACTOR_ID"],
                  "runner_name": os.environ["RUNNER_NAME"],
                  "runner_os": os.environ["RUNNER_OS"],
                  "runner_arch": os.environ["RUNNER_ARCH"],
              },
              "provider_path": {
                  "vcs_provider": os.environ["VCS_PROVIDER_ID"],
                  "ci_provider": os.environ["CI_PROVIDER_ID"],
              },
              "provider_specific_limitations": "provider-limitations.json",
              "production_authority": False,
              "client_data": False,
          }

          (root / "buildproof.json").write_text(
              json.dumps(buildproof, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          semantic_comparison = {
              "schema": "accordcraft.provider-substitution-semantic-comparison.v1",
              "task_id": os.environ["TASK_ID"],
              "canonical_semantic_digest_sha256": canonical_digest,
              "native_reference_path": {
                  "vcs_provider": os.environ["NATIVE_REFERENCE_VCS_PROVIDER"],
                  "ci_provider": os.environ["NATIVE_REFERENCE_CI_PROVIDER"],
                  "canonical_semantic_digest_sha256": canonical_digest,
              },
              "external_proof_path": {
                  "vcs_provider": os.environ["VCS_PROVIDER_ID"],
                  "ci_provider": os.environ["CI_PROVIDER_ID"],
                  "canonical_semantic_digest_sha256": canonical_digest,
              },
              "canonical_build_contract_semantics_stable": True,
              "canonical_buildproof_semantics_stable": True,
              "canonical_release_passport_semantics_stable": True,
              "provider_specific_evidence_isolated": True,
          }

          (root / "semantic-comparison.json").write_text(
              json.dumps(semantic_comparison, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          (
            cd proof/buildproof
            sha256sum \
              canonical-authorities.json \
              build-contract.json \
              buildproof.json \
              semantic-comparison.json \
              provider-limitations.json \
              > checksums.sha256
          )

      - name: Upload immutable BuildProof evidence
        id: buildproof_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: accordcraft-17a3-buildproof
          path: proof/buildproof/
          if-no-files-found: error
          retention-days: 1

      - name: Generate Release Passport from provider-native artifact evidence
        shell: bash
        env:
          BUILDPROOF_ARTIFACT_ID: ${{ steps.buildproof_upload.outputs.artifact-id }}
          BUILDPROOF_ARTIFACT_URL: ${{ steps.buildproof_upload.outputs.artifact-url }}
          BUILDPROOF_ARTIFACT_DIGEST: ${{ steps.buildproof_upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib, json, os, pathlib

          bp_root = pathlib.Path("proof/buildproof")
          rp_root = pathlib.Path("proof/release-passport")
          rp_root.mkdir(parents=True, exist_ok=True)

          canonical_digest = os.environ["CANONICAL_SEMANTIC_DIGEST"]
          build_contract_digest = hashlib.sha256(
              (bp_root / "build-contract.json").read_bytes()
          ).hexdigest().upper()
          buildproof_digest = hashlib.sha256(
              (bp_root / "buildproof.json").read_bytes()
          ).hexdigest().upper()

          release_passport = {
              "schema": "accordcraft.external-provider-release-passport-proof.v1",
              "task_id": os.environ["TASK_ID"],
              "proof_scope": os.environ["PROOF_SCOPE"],
              "canonical_semantic_digest_sha256": canonical_digest,
              "requirement_refs": [os.environ["TASK_ID"]],
              "commit_sha": os.environ["GITHUB_SHA"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "build_spec": {
                  "build_contract_sha256": build_contract_digest,
                  "buildproof_sha256": buildproof_digest,
                  "canonical_semantic_digest_sha256": canonical_digest,
              },
              "builder_worker_identity": {
                  "provider": os.environ["CI_PROVIDER_ID"],
                  "runner_name": os.environ["RUNNER_NAME"],
                  "runner_os": os.environ["RUNNER_OS"],
                  "runner_arch": os.environ["RUNNER_ARCH"],
                  "actor": os.environ["GITHUB_ACTOR"],
                  "actor_id": os.environ["GITHUB_ACTOR_ID"],
              },
              "toolchain_dependencies": {
                  "github_actions_runner": os.environ["RUNNER_NAME"],
                  "upload_artifact_action_full_sha": "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
                  "dependency_lock_scope": "WORKFLOW_ACTION_PIN_ONLY_FOR_SYNTHETIC_PROOF",
              },
              "buildproof_artifact": {
                  "artifact_id": os.environ["BUILDPROOF_ARTIFACT_ID"],
                  "artifact_url": os.environ["BUILDPROOF_ARTIFACT_URL"],
                  "artifact_digest_sha256": os.environ["BUILDPROOF_ARTIFACT_DIGEST"],
              },
              "verification_disposition": {
                  "tests": "MINIMAL_SYNTHETIC_PROOF_ONLY_NOT_PRODUCT_TEST_SUITE",
                  "quality": "NOT_PERFORMED_NOT_CLAIMED",
                  "security": "NOT_PERFORMED_NOT_CLAIMED",
                  "licensing": "NOT_PERFORMED_NOT_CLAIMED",
                  "sbom": "NOT_PRODUCED_NOT_CLAIMED",
                  "vulnerability": "NOT_PERFORMED_NOT_CLAIMED",
                  "provenance_attestation": "TASK_EVIDENCE_ONLY_NOT_SUPPLY_CHAIN_ATTESTATION",
                  "signature": "NOT_PRODUCED_NOT_CLAIMED",
                  "independent_rebuild": "NOT_PERFORMED_NOT_CLAIMED",
                  "staging_acceptance": "NOT_PERFORMED_NOT_CLAIMED",
                  "production_authorization": "NOT_REQUESTED_NOT_GRANTED",
                  "deployment": "NOT_PERFORMED_NOT_CLAIMED",
                  "rollback": "NOT_PERFORMED_NOT_CLAIMED",
              },
              "provider_substitution": {
                  "native_reference": {
                      "vcs_provider": os.environ["NATIVE_REFERENCE_VCS_PROVIDER"],
                      "ci_provider": os.environ["NATIVE_REFERENCE_CI_PROVIDER"],
                      "canonical_semantic_digest_sha256": canonical_digest,
                  },
                  "external_proof": {
                      "vcs_provider": os.environ["VCS_PROVIDER_ID"],
                      "ci_provider": os.environ["CI_PROVIDER_ID"],
                      "canonical_semantic_digest_sha256": canonical_digest,
                  },
                  "canonical_semantics_stable": True,
              },
              "production_authority": False,
              "client_data": False,
          }

          (rp_root / "release-passport.json").write_text(
              json.dumps(release_passport, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          (
            cd proof/release-passport
            sha256sum release-passport.json > checksums.sha256
          )

      - name: Upload immutable Release Passport evidence
        id: release_passport_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: accordcraft-17a3-release-passport
          path: proof/release-passport/
          if-no-files-found: error
          retention-days: 1

      - name: Emit provider artifact identities
        shell: bash
        env:
          BUILDPROOF_ARTIFACT_ID: ${{ steps.buildproof_upload.outputs.artifact-id }}
          BUILDPROOF_ARTIFACT_DIGEST: ${{ steps.buildproof_upload.outputs.artifact-digest }}
          RELEASE_PASSPORT_ARTIFACT_ID: ${{ steps.release_passport_upload.outputs.artifact-id }}
          RELEASE_PASSPORT_ARTIFACT_DIGEST: ${{ steps.release_passport_upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          printf 'BUILDPROOF_ARTIFACT_ID=%s\n' "${BUILDPROOF_ARTIFACT_ID}"
          printf 'BUILDPROOF_ARTIFACT_DIGEST=%s\n' "${BUILDPROOF_ARTIFACT_DIGEST}"
          printf 'RELEASE_PASSPORT_ARTIFACT_ID=%s\n' "${RELEASE_PASSPORT_ARTIFACT_ID}"
          printf 'RELEASE_PASSPORT_ARTIFACT_DIGEST=%s\n' "${RELEASE_PASSPORT_ARTIFACT_DIGEST}"